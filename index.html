<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAN SPORTS - Secure Payroll v6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #0f172a;
        }
        .industrial-orange { background-color: #ea580c; }
        .text-industrial { color: #ea580c; }
        
        @media print {
            .no-print { display: none !important; }
            .slip-container { border: 2px solid black !important; padding: 2rem !important; width: 100% !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCw8yl2vbFtShOxuiJUfZPhA2z5xORpJqU",
            authDomain: "payroll-csii.firebaseapp.com",
            projectId: "payroll-csii",
            storageBucket: "payroll-csii.firebasestorage.app",
            messagingSenderId: "231474443902",
            appId: "1:231474443902:web:c81ef44deca081d52bca2f",
            measurementId: "G-JYCEZ58WZS"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            const [view, setView] = useState('login');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [loading, setLoading] = useState(true);
            const [status, setStatus] = useState("Menghubungkan...");
            const [showPass, setShowPass] = useState(false);
            
            const [settings, setSettings] = useState({ companyName: "PT. CAN SPORTS INDUSTRIAL INDONESIA" });
            const [employees, setEmployees] = useState([]);
            const [userRole, setUserRole] = useState(null);
            const [sessionUser, setSessionUser] = useState(null);
            const [unlocked, setUnlocked] = useState(false);
            const [passInput, setPassInput] = useState('');

            useEffect(() => {
                // Diagnostik Koneksi
                auth.signInAnonymously()
                .then(() => {
                    setStatus("Koneksi Auth Berhasil. Memuat Database...");
                    
                    db.collection('settings').doc('config').onSnapshot(doc => {
                        if (doc.exists) setSettings(doc.data());
                        setLoading(false);
                    }, err => {
                        console.error(err);
                        setStatus("Gagal Membaca Database. Cek Firestore Rules Anda!");
                        setLoading(false);
                    });

                    db.collection('employees').onSnapshot(snap => {
                        setEmployees(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    }, err => console.error("Emp sync error", err));
                })
                .catch(err => {
                    console.error(err);
                    setStatus("Gagal Login. Aktifkan 'Anonymous Auth' di Firebase Console!");
                    setLoading(false);
                });
            }, []);

            const handleLogin = (u, p) => {
                const userLower = u.toLowerCase().trim();
                if (userLower === 'it.admin' && p === 'admin123') {
                    setUserRole('IT'); setView('portal'); setActiveTab('it-panel');
                    return;
                }
                if (userLower === 'hr.admin' && p === 'hr123') {
                    setUserRole('HR'); setView('portal'); setActiveTab('hr-panel');
                    return;
                }

                const found = employees.find(e => e.noPegawai === u.trim());
                if (found) {
                    if (p === '123456' || p === found.birthDate) {
                        setUserRole('EMPLOYEE'); setSessionUser(found); setView('portal'); setActiveTab('emp-portal');
                    } else { alert("Password salah."); }
                } else { alert("User ID / NIK tidak terdaftar."); }
            };

            const initDatabase = async () => {
                try {
                    await db.collection('settings').doc('config').set({
                        companyName: "PT. CAN SPORTS INDUSTRIAL INDONESIA",
                        logo: ""
                    });
                    await db.collection('employees').add({
                        name: "DEVINNA SARASWATI",
                        noPegawai: "A1101",
                        birthDate: "19012026",
                        dept: "Assembling",
                        jabatan: "Operator",
                        gajiPokok: 2595368
                    });
                    alert("DATABASE AKTIF! Silakan Refresh halaman.");
                } catch (err) {
                    alert("Gagal: " + err.message);
                }
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-slate-900 text-white p-10 text-center">
                    <div className="w-12 h-12 border-4 border-orange-600 border-t-transparent rounded-full animate-spin mb-6"></div>
                    <p className="font-bold text-sm tracking-widest">{status}</p>
                    <div className="mt-10 p-4 bg-white/5 rounded-2xl text-[10px] text-slate-400">
                        Pastikan di Firebase Console:<br/>
                        1. Firestore Database sudah dibuat (Jakarta)<br/>
                        2. Rules sudah diset ke "allow read, write: if true;"<br/>
                        3. Authentication "Anonymous" sudah Enabled
                    </div>
                </div>
            );

            if (view === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-8">
                        <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden">
                            <div className="industrial-orange p-12 text-center text-white relative">
                                <div className="w-20 h-20 bg-white/20 rounded-3xl mx-auto mb-6 flex items-center justify-center border border-white/30 backdrop-blur-lg">
                                    <i data-lucide="shield-check" className="w-10 h-10"></i>
                                </div>
                                <h1 className="text-xl font-extrabold tracking-tighter uppercase px-4 leading-tight">{settings.companyName}</h1>
                            </div>
                            
                            <div className="p-10 pt-10 space-y-6">
                                <div className="space-y-4">
                                    <input id="u" className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-orange-500 text-lg font-medium" placeholder="User ID / NIK" />
                                    <div className="relative">
                                        <input 
                                            id="p" 
                                            type={showPass ? "text" : "password"} 
                                            className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-orange-500 text-lg font-medium" 
                                            placeholder="Password" 
                                        />
                                        <button onClick={() => setShowPass(!showPass)} className="absolute right-4 top-4 text-slate-300">
                                            <i data-lucide={showPass ? "eye-off" : "eye"} className="w-5 h-5"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <button 
                                    onClick={() => handleLogin(document.getElementById('u').value, document.getElementById('p').value)}
                                    className="w-full industrial-orange hover:bg-orange-700 text-white font-black py-5 rounded-[2rem] shadow-xl shadow-orange-100 flex items-center justify-center gap-3 active:scale-95 transition-all"
                                >
                                    LOG IN <i data-lucide="chevron-right" className="w-5 h-5"></i>
                                </button>

                                {employees.length === 0 && (
                                    <div className="space-y-4">
                                        <div className="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-[10px] text-amber-700 font-bold leading-tight">
                                            ⚠️ DATABASE BELUM TERISI.<br/>Klik tombol di bawah untuk membuat data awal otomatis.
                                        </div>
                                        <button onClick={initDatabase} className="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl text-[10px] uppercase tracking-widest shadow-lg">Inisialisasi Database</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-slate-100">
                    <nav className="w-full md:w-80 bg-slate-900 text-white p-8 flex flex-col no-print shrink-0 shadow-2xl relative z-10">
                        <div className="mb-12 flex items-center gap-4 bg-white/5 p-4 rounded-[2rem] border border-white/5">
                            <div className="w-12 h-12 industrial-orange rounded-2xl flex items-center justify-center font-black shadow-lg">CS</div>
                            <div className="overflow-hidden">
                                <p className="text-[10px] font-black text-orange-500 uppercase tracking-widest leading-none mb-1">SYSTEM LIVE</p>
                                <p className="font-bold text-xs truncate opacity-80">{settings.companyName}</p>
                            </div>
                        </div>
                        <div className="flex-1 space-y-4">
                            {userRole === 'IT' && <button onClick={() => setActiveTab('it-panel')} className={`w-full text-left p-5 rounded-2xl font-bold flex items-center gap-4 transition-all ${activeTab === 'it-panel' ? 'industrial-orange shadow-lg translate-x-2' : 'text-slate-500 hover:bg-white/5'}`}><i data-lucide="settings"></i> Branding IT</button>}
                            {(userRole === 'HR' || userRole === 'IT') && (
                                <button onClick={() => setActiveTab('hr-data')} className={`w-full text-left p-5 rounded-2xl font-bold flex items-center gap-4 transition-all ${activeTab === 'hr-data' ? 'industrial-orange shadow-lg translate-x-2' : 'text-slate-500 hover:bg-white/5'}`}><i data-lucide="users"></i> Data Karyawan</button>
                            )}
                            {userRole === 'EMPLOYEE' && <button onClick={() => setActiveTab('emp-portal')} className={`w-full text-left p-5 rounded-2xl font-bold flex items-center gap-4 transition-all ${activeTab === 'emp-portal' ? 'industrial-orange shadow-lg translate-x-2' : 'text-slate-500 hover:bg-white/5'}`}><i data-lucide="file-text"></i> Slip Gaji</button>}
                        </div>
                        <button onClick={() => window.location.reload()} className="p-5 text-red-400 font-bold flex items-center gap-4 hover:bg-red-500/10 rounded-2xl mt-10 transition-all active:scale-95"><i data-lucide="log-out"></i> Keluar</button>
                    </nav>

                    <main className="flex-1 p-8 md:p-14 overflow-auto">
                        {activeTab === 'it-panel' && (
                            <div className="max-w-2xl mx-auto space-y-10">
                                <h3 className="text-3xl font-black text-slate-800 tracking-tighter">BRANDING PERUSAHAAN</h3>
                                <div className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100 space-y-8">
                                    <div className="space-y-3">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Nama PT (Sync Cloud)</label>
                                        <input id="cn" defaultValue={settings.companyName} className="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-3xl outline-none focus:border-orange-500 text-lg font-bold" />
                                    </div>
                                    <button onClick={async () => { await db.collection('settings').doc('config').update({ companyName: document.getElementById('cn').value }); alert("Diperbarui!"); }} className="w-full bg-slate-900 text-white py-6 rounded-[2rem] font-black shadow-xl flex items-center justify-center gap-3 active:scale-95 transition-all">SIMPAN PERUBAHAN</button>
                                </div>
                            </div>
                        )}
                        {activeTab === 'emp-portal' && (
                            <div className="max-w-4xl mx-auto">
                                {!unlocked ? (
                                    <div className="bg-white p-14 rounded-[4rem] shadow-2xl text-center space-y-10 border border-orange-100">
                                        <div className="w-20 h-20 bg-orange-100 text-orange-600 rounded-[2rem] flex items-center justify-center mx-auto shadow-inner"><i data-lucide="lock" className="w-10 h-10"></i></div>
                                        <div className="space-y-2"><h3 className="text-2xl font-black text-slate-800 uppercase tracking-tight">Slip Terkunci</h3><p className="text-slate-500 font-medium">Verifikasi Tanggal Lahir (DDMMYYYY)</p></div>
                                        <div className="max-w-xs mx-auto space-y-5">
                                            <input type="password" maxLength={8} placeholder="DDMMYYYY" className="w-full text-center text-3xl font-black p-6 bg-slate-50 border-2 rounded-3xl outline-none focus:border-orange-600 tracking-[0.4em]" onChange={e => setPassInput(e.target.value)} />
                                            <button onClick={() => passInput === sessionUser.birthDate ? setUnlocked(true) : alert('Gagal.')} className="w-full industrial-orange text-white font-black py-6 rounded-3xl shadow-xl flex items-center justify-center gap-3">BUKA SLIP <i data-lucide="unlock" className="w-5 h-5"></i></button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-8 pb-20 no-scrollbar">
                                        <div className="flex justify-between items-center no-print">
                                            <button onClick={() => setUnlocked(false)} className="text-slate-400 font-black text-[10px] uppercase tracking-widest flex items-center gap-2">Tutup</button>
                                            <button onClick={() => window.print()} className="bg-slate-900 text-white px-10 py-4 rounded-3xl font-black flex items-center gap-3 shadow-2xl active:scale-95 transition-all"><i data-lucide="printer"></i> CETAK A5</button>
                                        </div>
                                        <div className="bg-white p-10 border-4 border-black font-mono text-[11px] slip-container mx-auto shadow-2xl relative overflow-hidden">
                                            <div className="flex justify-between border-b-4 border-black pb-5 mb-8">
                                                <div className="flex gap-6 items-center">
                                                    <div className="w-12 h-12 bg-black flex items-center justify-center text-white text-[10px] font-black rounded-lg">CS</div>
                                                    <div><h4 className="font-black text-[16px] uppercase tracking-tighter leading-none">{settings.companyName}</h4><p className="font-black underline text-xs mt-1 italic">SLIP GAJI - PERIODE MARET 2026</p></div>
                                                </div>
                                                <div className="text-right italic border-2 border-black p-2 font-black h-fit text-[9px]">CONFIDENTIAL</div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-10 mb-8">
                                                <div className="space-y-1"><p>NIK: <span className="font-black">{sessionUser.noPegawai}</span></p><p>NAMA: <span className="font-black uppercase">{sessionUser.name}</span></p><p>DEPT: <span className="font-black uppercase">{sessionUser.dept}</span></p></div>
                                                <div className="text-right space-y-1 font-bold"><p>HK KERJA: 21 HARI</p><p>LEMBUR WD: 12 JAM</p><p>LEMBUR HD: 07 JAM</p></div>
                                            </div>
                                            <div className="border-y-4 border-black py-8 grid grid-cols-2 gap-20">
                                                <div className="space-y-4">
                                                    <p className="font-black underline mb-3 text-xs uppercase">Penerimaan (+)</p>
                                                    <div className="space-y-1"><div className="flex justify-between"><span>Gaji Pokok</span><span>2.595.368</span></div><div className="flex justify-between"><span>Tunjangan</span><span>220.000</span></div><div className="flex justify-between italic"><span>Total Lembur</span><span>525.074</span></div><div className="flex justify-between font-black border-t-2 border-black mt-4 pt-2 text-[14px]"><span>TOTAL GROSS</span><span>3.340.442</span></div></div>
                                                </div>
                                                <div className="space-y-4">
                                                    <p className="font-black underline mb-3 text-xs uppercase">Potongan (-)</p>
                                                    <div className="space-y-1"><div className="flex justify-between"><span>BPJS JHT</span><span>51.907</span></div><div className="flex justify-between"><span>BPJS Kes</span><span>25.954</span></div><div className="flex justify-between font-black border-t-2 border-black mt-4 pt-2 text-[14px] text-red-600"><span>TOTAL POT</span><span>77.861</span></div></div>
                                                </div>
                                            </div>
                                            <div className="mt-10 flex justify-between items-end">
                                                <div className="bg-slate-50 p-5 rounded-2xl border-2 border-black"><p className="text-[10px] font-black text-slate-500 uppercase tracking-tighter mb-1">Take Home Pay</p><p className="text-4xl font-black tracking-tighter">Rp 3.262.581</p></div>
                                                <div className="text-center text-[10px] space-y-14 pr-10">
                                                    <p className="uppercase font-bold tracking-widest">MAJALENGKA, 31 MARET 2026</p>
                                                    <p className="font-black border-t-2 border-black pt-1 px-10 uppercase tracking-widest leading-none">{sessionUser.name}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setInterval(() => lucide.createIcons(), 1000);
    </script>
</body>
</html>
