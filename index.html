<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>E-PaySlip System</title>
    
    <!-- PWA & Theme Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FF4E00">
    
    <!-- Fonts: Montserrat Only -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        :root { 
            --primary: #FF4E00; 
            --secondary: #121212; 
            --accent: #55E6C1;
            --bg-body: #F8FAF8;
        }

        /* Tipografi & Ruang */
        * { 
            font-family: 'Montserrat', sans-serif !important; 
            letter-spacing: 0 !important; 
            font-style: normal !important;
        }

        body { 
            background-color: var(--secondary); 
            margin: 0; 
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            color: white;
        }

        /* CSS Splash Screen (Anti-Stuck) */
        #splash {
            position: fixed; inset: 0; background: var(--secondary);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: transform 0.8s cubic-bezier(0.85, 0, 0.15, 1);
        }

        .logo-box-square {
            width: 110px; height: 110px; background: white; border-radius: 30px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        /* Auth Layout (Fixed Center) */
        .auth-container {
            height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center;
            background-color: var(--secondary);
            position: fixed; inset: 0; z-index: 50;
        }

        .auth-card {
            background: white; width: 88%; max-width: 410px;
            border-radius: 3rem; padding: 3.5rem 2.5rem;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            color: var(--secondary);
        }

        /* Portal Layout */
        .portal-main {
            background: var(--bg-body); border-radius: 3.5rem 3.5rem 0 0;
            position: fixed; bottom: 0; left: 0; right: 0; height: 86vh;
            z-index: 10; overflow-y: auto; color: var(--secondary);
            box-shadow: 0 -20px 80px rgba(0,0,0,0.2);
            padding-bottom: 120px;
        }

        /* Forms & Buttons */
        .field-standard {
            width: 100%; padding: 1.25rem 1.5rem; border-radius: 1.5rem;
            background: #F3F4F6; border: 2px solid transparent;
            font-weight: 700; outline: none; transition: 0.3s;
            color: var(--secondary); font-size: 15px;
        }
        .field-standard:focus { border-color: var(--primary); background: white; }

        .btn-orange-vivid {
            background-color: var(--primary); color: white; font-weight: 900;
            padding: 1.25rem; border-radius: 1.5rem; width: 100%;
            text-transform: uppercase; box-shadow: 0 12px 25px rgba(255, 78, 0, 0.3);
            transition: 0.3s; font-size: 14px;
        }
        .btn-orange-vivid:active { transform: scale(0.96); opacity: 0.9; }

        /* Navigation */
        .nav-bottom {
            position: fixed; bottom: 0; left: 0; right: 0; height: 100px;
            background: white; border-top: 1px solid rgba(0,0,0,0.05);
            display: flex; align-items: center; justify-content: space-around;
            padding: 0 20px; z-index: 100;
        }

        .nav-link { display: flex; flex-direction: column; align-items: center; color: #CBD5E1; gap: 4px; border: none; background: none; }
        .nav-link.active { color: var(--primary); }
        .nav-link span { font-size: 9px; font-weight: 900; text-transform: uppercase; }

        .toast-notif {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 85%; max-width: 450px;
            background: var(--secondary); color: white; padding: 1.25rem;
            border-radius: 2rem; border-left: 12px solid var(--primary);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            display: flex; align-items: center; gap: 15px;
            animation: slideInDown 0.5s forwards;
        }
        @keyframes slideInDown { from { transform: translate(-50%, -150%); } to { transform: translate(-50%, 0); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <!-- FAIL-SAFE SPLASH SCREEN -->
    <div id="splash">
        <div class="logo-box-square">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#FF4E00" stroke-width="3.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <h2 class="mt-12 text-white font-black uppercase text-[10px] opacity-40">E-PaySlip System</h2>
        <div class="mt-12 flex gap-2">
            <div class="w-1.5 h-1.5 bg-white rounded-full animate-bounce"></div>
            <div class="w-1.5 h-1.5 bg-white rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
            <div class="w-1.5 h-1.5 bg-white rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
        </div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        /* --- FIREBASE CONFIGURATION --- */
        const firebaseConfig = {
            apiKey: "", 
            authDomain: "payroll-csii.firebaseapp.com",
            projectId: "payroll-csii",
            storageBucket: "payroll-csii.firebasestorage.app",
            messagingSenderId: "231474443902",
            appId: "1:231474443902:web:c81ef44deca081d52bca2f",
            measurementId: "G-JYCEZ58WZS"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            // Main States
            const [view, setView] = useState('login'); 
            const [tab, setTab] = useState('home');
            const [role, setRole] = useState(null);
            const [user, setUser] = useState(null);
            const [settings, setSettings] = useState({ companyName: "PT. CAN SPORTS INDUSTRIAL INDONESIA", logo: "" });
            const [employees, setEmployees] = useState([]);
            
            // Interaction States
            const [showPass, setShowPass] = useState(false);
            const [toast, setToast] = useState({ show: false, msg: "" });
            const [resetForm, setResetForm] = useState({ p1: '', p2: '' });
            const [unlockedSlip, setUnlockedSlip] = useState(false);

            const notify = (msg) => {
                setToast({ show: true, msg });
                setTimeout(() => setToast({ show: false, msg: "" }), 4000);
            };

            useEffect(() => {
                const initSync = async () => {
                    await auth.signInAnonymously().catch(() => console.log("Cloud Disabled"));
                    
                    db.collection('settings').doc('config').onSnapshot(doc => {
                        if (doc.exists) setSettings(doc.data());
                    });
                    db.collection('employees').onSnapshot(snap => setEmployees(snap.docs.map(d => d.data())));
                };
                initSync();

                // Dismiss Splash after 3 seconds (fail-safe)
                const splashTimer = setTimeout(() => {
                    const el = document.getElementById('splash');
                    if (el) { el.style.transform = 'translateY(-100%)'; setTimeout(() => el.remove(), 800); }
                }, 3000);
                return () => clearTimeout(splashTimer);
            }, []);

            const processLogin = (u, p) => {
                const uL = u.toLowerCase().trim();
                // Administrator Access
                if (uL === 'it.admin' && p === 'admin123') {
                    setRole('IT'); setView('portal'); setTab('it'); notify("Akses Administrator Terkonfirmasi.");
                } else if (uL === 'hr.admin' && p === 'hr123') {
                    setRole('HR'); setView('portal'); setTab('hr'); notify("Akses Personalia Terkonfirmasi.");
                } else {
                    // Employee Access
                    const found = employees.find(e => e.id === u.trim());
                    if (found && (p === found.password || p === '123456' || p === found.birth)) {
                        setUser(found); setRole('USER');
                        if (p === '123456') { setView('reset-pin'); }
                        else { setView('portal'); setTab('home'); notify(`Selamat Datang, ${found.name.split(' ')[0]}`); }
                    } else { alert("Otorisasi Ditolak. Periksa NIK atau Kata Sandi."); }
                }
            };

            // --- VIEW: LOGIN AREA ---
            if (view === 'login') {
                return (
                    <div className="auth-container animate-[fadeIn_0.5s]">
                        <div className="flex flex-col items-center w-full">
                            <div className="text-center mb-12">
                                <div className="logo-box-square bg-white mx-auto mb-10">
                                    {settings.logo ? <img src={settings.logo} className="w-full h-full object-contain p-4" /> : <svg width="55" height="55" viewBox="0 0 24 24" fill="none" stroke="#FF4E00" strokeWidth="3.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>}
                                </div>
                                <h1 className="text-3xl font-black uppercase text-white">E-PaySlip <span className="text-[#FF4E00]">System</span></h1>
                                <p className="text-[10px] font-bold text-white/40 uppercase mt-4 px-12 leading-relaxed">{settings.companyName}</p>
                            </div>

                            <div className="auth-card">
                                <div className="space-y-6">
                                    <div className="text-left">
                                        <label className="text-[11px] font-black text-slate-400 uppercase ml-2">Nomor Induk Karyawan</label>
                                        <input id="f_user" className="field-standard mt-2 shadow-inner" placeholder="Assembling (A1xxx)" />
                                    </div>
                                    <div className="text-left relative">
                                        <label className="text-[11px] font-black text-slate-400 uppercase ml-2">Kata Sandi</label>
                                        <input id="f_pass" type={showPass ? "text" : "password"} className="field-standard mt-2 shadow-inner" placeholder="••••••••" />
                                        <button onClick={()=>setShowPass(!showPass)} className="absolute right-5 bottom-4 text-slate-300 border-none bg-transparent">
                                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                        </button>
                                    </div>
                                    <button onClick={()=>processLogin(document.getElementById('f_user').value, document.getElementById('f_pass').value)} className="btn-orange-vivid mt-6">Otorisasi Akses</button>
                                    <p className="text-[10px] font-black text-[#FF4E00] text-center mt-12 tracking-widest cursor-pointer">Lupa PIN? Hubungi IT Admin</p>
                                </div>
                            </div>
                            <p className="mt-12 text-white/20 text-[9px] font-bold uppercase tracking-widest">Authorized Access Only</p>
                        </div>
                    </div>
                );
            }

            // --- VIEW: RESET PIN ---
            if (view === 'reset-pin') {
                return (
                    <div className="auth-container">
                        <div className="auth-card space-y-8 animate-[slideInUp_0.5s]">
                            <div className="text-center">
                                <h3 className="text-xl font-black uppercase text-[#FF4E00]">Keamanan Baru</h3>
                                <p className="text-[11px] font-bold text-slate-400 mt-2 leading-relaxed">PIN default terdeteksi. Silakan perbarui PIN 6-digit Anda untuk keamanan data.</p>
                            </div>
                            <div className="space-y-4">
                                <input type="password" placeholder="PIN Baru" className="field-standard shadow-inner" onChange={e => setResetForm({...resetForm, p1: e.target.value})} />
                                <input type="password" placeholder="Konfirmasi PIN" className="field-standard shadow-inner" onChange={e => setResetForm({...resetForm, p2: e.target.value})} />
                            </div>
                            <button onClick={async()=>{
                                if(resetForm.p1 !== resetForm.p2) return alert("PIN konfirmasi tidak cocok.");
                                if(resetForm.p1.length < 6) return alert("PIN minimal 6 digit.");
                                await db.collection('employees').doc(user.id).update({password: resetForm.p1});
                                notify("Keamanan Akun Diperbarui."); setView('login');
                            }} className="btn-orange-vivid">Simpan PIN Baru</button>
                        </div>
                    </div>
                );
            }

            // --- VIEW: PORTAL (Main Hub) ---
            return (
                <div className="min-h-screen flex flex-col">
                    {/* PORTAL HEADER */}
                    <header className="p-8 pb-14 flex justify-between items-center no-print">
                        <div className="flex items-center gap-5">
                            <div className="w-14 h-14 bg-white rounded-3xl flex items-center justify-center shadow-xl border-2 border-white/10 overflow-hidden">
                                {settings.logo ? <img src={settings.logo} className="w-full h-full object-contain p-2" /> : <div className="font-black text-orange-600">CS</div>}
                            </div>
                            <div className="text-white leading-none">
                                <p className="text-[10px] font-black uppercase opacity-40 mb-1">Authenticated</p>
                                <h2 className="text-lg font-black uppercase truncate max-w-[150px]">{role === 'USER' ? user.name : role}</h2>
                            </div>
                        </div>
                        <button onClick={()=>{ notify("Sesi ditutup."); setTimeout(()=>window.location.reload(), 1000); }} className="w-14 h-14 bg-white/5 rounded-3xl flex items-center justify-center text-white border border-white/5 shadow-lg active:bg-red-500">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                        </button>
                    </header>

                    <main className="portal-main p-10 pt-12 animate-[slideInUp_0.5s] no-scrollbar">
                        
                        {/* TAB: DASHBOARD KARYAWAN */}
                        {tab === 'home' && role === 'USER' && (
                            <div className="space-y-10">
                                <div className="p-10 rounded-[4rem] bg-[#FF4E00] text-white shadow-2xl relative overflow-hidden">
                                    <div className="absolute -right-12 -bottom-12 opacity-5 scale-150 rotate-12"><svg width="200" height="200" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
                                    <p className="text-[11px] font-black opacity-60 uppercase mb-2">Industrial Portal</p>
                                    <h3 className="text-3xl font-black uppercase leading-tight border-b-2 border-white/10 pb-8">{user.name}</h3>
                                    <p className="mt-8 text-[11px] font-black uppercase opacity-50">{user.dept} • {user.id}</p>
                                </div>

                                <div className="space-y-4">
                                    <h4 className="font-black text-[10px] uppercase ml-6 opacity-40">Menu Layanan</h4>
                                    <div className="grid gap-3">
                                        <div onClick={()=>setUnlockedSlip(true)} className="bg-white p-6 rounded-[2.5rem] flex items-center gap-6 shadow-sm border border-slate-100 active:scale-95 transition-all">
                                            <div className="w-14 h-14 rounded-2xl bg-[#FF4E00]/10 flex items-center justify-center text-[#FF4E00]"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg></div>
                                            <span className="font-black uppercase text-[11px] text-slate-700">Lihat Slip Gaji</span>
                                        </div>
                                        <div onClick={()=>notify("Arsip Laporan belum dipublish.")} className="bg-white p-6 rounded-[2.5rem] flex items-center gap-6 shadow-sm border border-slate-100 opacity-40 transition-all">
                                            <div className="w-14 h-14 rounded-2xl bg-slate-100 flex items-center justify-center text-slate-400"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
                                            <span className="font-black uppercase text-[11px] text-slate-700">Arsip Laporan Gaji</span>
                                        </div>
                                    </div>
                                </div>

                                {unlockedSlip && (
                                     <div className="p-10 border-4 border-black font-mono text-[10px] bg-white mt-10 print-area shadow-2xl animate-[slideInUp_0.5s] text-black">
                                        <div className="flex justify-between border-b-4 border-black pb-5 mb-8 items-center text-black">
                                            <div className="flex gap-4">
                                                <div className="w-14 h-14 bg-black text-white flex items-center justify-center font-black rounded-xl text-3xl italic">S</div>
                                                <div><h4 className="font-black text-[16px] leading-none mb-2 uppercase">{settings.companyName}</h4><p className="font-black underline text-[10px] opacity-60 uppercase">Digital Pay Slip #MAR-2026</p></div>
                                            </div>
                                            <div className="border-4 border-black p-2 font-black text-[10px] uppercase">Confidential</div>
                                        </div>
                                        <div className="grid grid-cols-2 mb-10 gap-10 text-[12px] text-black">
                                            <div className="space-y-2"><p>NIK: {user.id}</p><p className="font-black uppercase">NAMA: {user.name}</p></div>
                                            <div className="text-right space-y-2"><p>HK: 21 HARI</p><p>MARET 2026</p></div>
                                        </div>
                                        <div className="border-y-4 border-black py-10 grid grid-cols-2 gap-20 text-black">
                                            <div className="space-y-4 text-[12px]"><p className="font-black underline uppercase text-[9px]">Earnings (+)</p><div className="flex justify-between"><span>Gaji Pokok</span><span>2.595.368</span></div><div className="flex justify-between font-black border-t-2 border-black mt-4 pt-3"><span>TOTAL</span><span>2.595.368</span></div></div>
                                            <div className="space-y-4 text-[12px]"><p className="font-black underline uppercase text-[9px]">Deductions (-)</p><div className="flex justify-between"><span>BPJS JHT</span><span>51.907</span></div><div className="flex justify-between font-black border-t-2 border-black mt-4 pt-3 text-red-600"><span>TOTAL</span><span>51.907</span></div></div>
                                        </div>
                                        <div className="mt-12 flex justify-between items-end">
                                            <div className="bg-slate-100 p-8 border-4 border-black rounded-[2.5rem]"><p className="text-[10px] font-black text-slate-500 uppercase mb-1 leading-none">Net Salary</p><p className="text-5xl font-black">Rp 2.543.461</p></div>
                                            <button onClick={()=>window.print()} className="no-print bg-black text-white px-8 py-4 rounded-2xl font-bold uppercase text-[10px] shadow-xl">Simpan PDF</button>
                                        </div>
                                     </div>
                                )}
                            </div>
                        )}

                        {/* TAB: IT Hub */}
                        {tab === 'it' && role === 'IT' && (
                            <div className="space-y-8 animate-fade">
                                <div className="flex bg-slate-200/50 p-1.5 rounded-3xl gap-1">
                                    {['branding', 'user', 'audit'].map(s => <button key={s} onClick={()=>notify("Dashboard IT Ready.")} className={`flex-1 py-4 rounded-2xl text-[9px] font-black uppercase ${s==='branding'?'bg-white text-orange shadow-md':'text-slate-400'}`}>{s}</button>)}
                                </div>
                                <div className="card bg-white p-8 rounded-[2.5rem] space-y-6 shadow-sm border border-slate-100">
                                    <input id="it_val_name" defaultValue={settings.companyName} className="field-standard" placeholder="Nama Perusahaan" />
                                    <div className="border-4 border-dashed border-slate-100 p-12 rounded-[2.5rem] text-center bg-slate-50 relative active:bg-slate-100">
                                        <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" onChange={(e)=>{
                                            const r = new FileReader(); r.onloadend = () => setSettings({...settings, logo: r.result}); r.readAsDataURL(e.target.files[0]);
                                        }} />
                                        <p className="text-[10px] font-black text-slate-400 uppercase italic">Update Logo PT (Kotak)</p>
                                    </div>
                                    <button onClick={async()=>{
                                        await db.collection('settings').doc('config').update({companyName: document.getElementById('it_val_name').value, logo: settings.logo});
                                        notify("Pengaturan Cloud Tersimpan.");
                                    }} className="btn-vivid-orange">Simpan Konfigurasi</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* TOAST SYSTEM */}
                    {toast.show && (
                        <div className="toast-msg">
                            <div className="w-12 h-12 bg-[#FF4E00] rounded-2xl flex items-center justify-center shrink-0 shadow-lg">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="4"><path d="M20 6L9 17l-5-5"/></svg>
                            </div>
                            <p className="text-[11px] font-black uppercase leading-relaxed flex-1">{toast.msg}</p>
                        </div>
                    )}

                    {/* BOTTOM NAVIGATION */}
                    <nav className="bottom-nav no-print shadow-[0_-15px_60px_rgba(0,0,0,0.08)]">
                        {role === 'IT' && <button onClick={()=>setTab('it')} className={`nav-tab ${tab==='it'?'active':''}`}><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span>Admin</span></button>}
                        {role === 'USER' && <button onClick={()=>setTab('dash')} className={`nav-tab ${tab==='dash'?'active':''}`}><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/></svg><span>Beranda</span></button>}
